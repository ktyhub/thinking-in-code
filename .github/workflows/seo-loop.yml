name: SEO Loop

# 每周一次闭环：结算到期实验 → 采搜索数据 → 生成提案 → 边界内执行 → 复盘。
#
# 为什么不每天都跑：一次变更的观测窗是 28 天（CTR 类 42 天）。跑得比观测窗
# 更勤，等于在数据还没反映上一轮效果时又改一轮，所有实验互相污染，最后
# 一条结论都得不出来。每周一次，加上账本里的冷却期，才是可测的节奏。
#
# 写回的是配置（索引闸门 / 排序 / 内部链接 / 采集优先级），不是页面代码。
# 提交后由 ci.yml 正常部署，所以改动会和普通提交一样经过构建与审计。

on:
  schedule:
    - cron: "0 5 * * 1"      # 每周一 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只提案不写盘"
        type: boolean
        default: false

concurrency:
  group: seo-loop
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    # secrets 不能直接写在 if: 里（GitHub 在条件求值阶段拿不到它），
    # 必须先经 env 中转。顺带避免把密钥字符串拼进 run: 脚本——那会把
    # 密钥变成可注入的 shell 片段。
    env:
      GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
      BING_WEBMASTER_KEY: ${{ secrets.BING_WEBMASTER_KEY }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只有配了服务账号才装签名库；没配就走 Bing / 手工导出通道
      - name: 准备 GSC 凭据
        if: env.GSC_SA_JSON != ''
        run: |
          printf '%s' "$GSC_SA_JSON" > /tmp/gsc-sa.json
          chmod 600 /tmp/gsc-sa.json
          echo "GSC_SERVICE_ACCOUNT=/tmp/gsc-sa.json" >> "$GITHUB_ENV"
          pip install --quiet cryptography

      # 判死规则要有全量 URL 清单才能找出「已索引但零展示」的页面。
      # 优先读线上 sitemap，读不到就跳过该规则（decide 内部会降级）。
      - name: 取当前线上 URL 清单
        run: |
          mkdir -p site/dist
          if curl -sf https://www.stags.cn/sitemap-index.xml -o /tmp/smi.xml; then
            for u in $(grep -o '<loc>[^<]*</loc>' /tmp/smi.xml | sed 's/<[^>]*>//g'); do
              curl -sf "$u" -o "site/dist/$(basename "$u")" || true
            done
            echo "已取 $(ls site/dist | wc -l) 个 sitemap 分片"
          else
            echo "线上 sitemap 不可读，本轮跳过判死类规则"
          fi

      - name: 运行闭环
        run: |
          FLAG=""
          if [ "$DRY_RUN" = "true" ]; then FLAG="--no-telemetry"; fi
          # 单条规则出错不应让整轮失败；真正的写入错误会以非零退出
          set -o pipefail
          python3 scripts/release-tracker/loop.py --apply $FLAG | tee /tmp/report.txt

      - name: 提交变更
        run: |
          git config user.name  "seo-loop"
          git config user.email "seo-loop@users.noreply.github.com"
          if git diff --quiet -- site/src/data scripts/release-tracker/config.json data/; then
            echo "本轮无变更"
            exit 0
          fi
          REV=$(python3 -c "import json;print(json.load(open('site/src/data/loop-state.json'))['revision'])")
          SUMMARY=$(python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/seo/proposals.json")
          if not p.exists():
              print("- 无提案")
              raise SystemExit
          for a in json.loads(p.read_text()).get("actions", []):
              print(f"- {a['rule']}: {a['target']}")
          PY
          )
          git add -A site/src/data scripts/release-tracker/config.json data/
          git commit -q -m "chore(loop): 闭环第 ${REV} 轮 — 按搜索表现调整策略" -m "${SUMMARY}" \
            -m "判据与基线见 data/loop-ledger.jsonl；回滚：python3 scripts/release-tracker/loop.py rollback <id>"
          git push

      - name: 报告入摘要
        if: always()
        run: |
          {
            echo '### SEO 闭环报告'
            echo '```'
            tail -60 /tmp/report.txt 2>/dev/null || echo '未产出报告'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
