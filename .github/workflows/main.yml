name: ci
# NextStack 官网（Astro 静态站，7 语言）
# 内容直接读取 docs/ 目录 —— release-tracker 流水线每日推送的新文章
# 会随本次构建自动收录进站点与 sitemap。
#
# ── 为什么分成三个 job 并行构建 ────────────────────────────────────────
# 全量构建是「页数 × 每页成本」，页数一涨，构建时长线性上涨（本地实测
# 6,381 页 / 597 秒生成时间）。所以按语言把构建切成互不重叠的分片，
# 并行跑完再合并产物：
#
#   en        英文全部页面（根路径，页数最多，通常是最长的一根板）
#   zh        中文（/zh/ 前缀）
#   i18n      ja/de/fr/es/pt 五种机翻语言（/{locale}/ 前缀）
#
# 关键点：分片只是「构建期」的切分，**部署产物仍然是同一个站点、同一个域名、
# 同一套 URL**。所以对 SEO 零影响，不需要网关、不需要多域名。
#
# 这条路也是 1 GB 上限的解法：现在三个分片合并成一个 GitHub Pages 项目，
# 将来页面量逼近 1 GB 时，已合并的边界可以直接变成「en 一个项目、zh 一个项目」，
# 物理上拆到两个配额里（需要 Cloudflare Worker 做统一入口，见 TEN_MILLION.md）。
#
# 新增语言时：把语言加进 i18n 分片的 locales，或者单独加一行分片即可，
# 不需要改合并逻辑。
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: en
            locales: en
          - shard: zh
            locales: zh
          - shard: i18n
            locales: ja,de,fr,es,pt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        working-directory: site
        run: npm ci

      - name: 构建站点（分片 ${{ matrix.shard }}）
        working-directory: site
        # 广告单元 ID 可由仓库 Secret 覆盖；设为 off 可一键下线广告位。
        # 未配置时使用代码里的默认单元（stags版本详情页）。
        env:
          PUBLIC_ADSENSE_DETAIL_SLOT: ${{ secrets.ADSENSE_DETAIL_SLOT }}
          # 只生成本分片的语言；不设置时 Astro 会全量构建，本地开发行为不变。
          SITE_LOCALES: ${{ matrix.locales }}
        run: |
          /usr/bin/time -f "分片 ${{ matrix.shard }} 构建耗时 %e 秒" npm run build

      - name: 记录分片规模
        working-directory: site
        run: |
          n=$(find dist -name '*.html' | wc -l)
          echo "分片 ${{ matrix.shard }}（${{ matrix.locales }}）：$n 页" | tee -a "$GITHUB_STEP_SUMMARY"

      # 为什么打成 tar 再传，而不是直接传目录：
      # upload-artifact 会在上传前逐条校验文件名，URL 里合法的字符（空格、|、"）
      # 都会被它拒收。release 标题进过文件名的历史数据里就带着这些字符，
      # 一条脏数据就能让整个分片失败。tar 不关心文件名，部署端照样能用。
      - name: 打包分片产物
        working-directory: site
        run: tar -czf dist-shard.tar.gz dist

      - name: 上传分片产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.shard }}
          path: site/dist-shard.tar.gz
          retention-days: 1

  # 分片产物在这里合并成一份完整站点。
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部分片
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: shards

      - name: 解开分片产物
        run: |
          # 每个分片是一个 tar.gz，里面顶层就是 dist/，解到分片自己的目录下
          # 变成 shards/dist-en/index.html 这种形状，正好是 merge_dist.py 要的输入。
          for d in shards/*/; do
            echo "解包 $d"
            tar -xzf "$d/dist-shard.tar.gz" -C "$d" --strip-components=1
            rm -f "$d/dist-shard.tar.gz"
          done
          ls -1 shards

      - name: 合并分片并重建 sitemap
        # 分片之间路径必须不重叠，重叠且内容不同时脚本会失败退出——
        # 那说明 SITE_LOCALES 划错了，合并出问题比部署出问题容易查得多。
        run: |
          python3 scripts/release-tracker/merge_dist.py \
            shards/dist-en shards/dist-zh shards/dist-i18n \
            --out site/dist

      # 索引闸门校验：确认合并后的产物真的按 index-gate.json 执行了。
      # 不通过就不部署——带病上线（比如闸门配错导致百万页全量放开）
      # 需要几周才会在 Search Console 显现，那时已经晚了。
      - name: SEO 审计（闸门与产物一致性）
        run: python3 scripts/release-tracker/seo_audit.py --strict

      # GitHub Pages 的站点体积上限是 1 GB，超了不是「部署变慢」而是直接失败，
      # 而且是在发版中途失败——那天采集的内容就上不去。所以在接近上限之前
      # 就要把水位摆在明面上，留出足够时间做物理拆分（见 TEN_MILLION.md）。
      - name: 站点体积水位检查
        run: |
          SIZE_MB=$(du -sm site/dist | cut -f1)
          PAGES=$(find site/dist -name '*.html' | wc -l)
          LIMIT_MB=1024
          PCT=$((SIZE_MB * 100 / LIMIT_MB))
          PER_KB=$((SIZE_MB * 1024 / PAGES))
          ROOM=$(( (LIMIT_MB - SIZE_MB) * 1024 / PER_KB ))
          echo "站点体积 ${SIZE_MB} MB / ${LIMIT_MB} MB（${PCT}%），${PAGES} 页，平均 ${PER_KB} KB/页，剩余约 ${ROOM} 页"
          {
            echo "### 站点体积"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 体积 | ${SIZE_MB} MB / ${LIMIT_MB} MB（${PCT}%） |"
            echo "| 页面 | ${PAGES} 页，平均 ${PER_KB} KB |"
            echo "| 剩余可容纳 | 约 ${ROOM} 页 |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -ge 95 ]; then
            echo "::error::站点体积已达 1 GB 上限的 ${PCT}%，仅剩约 ${ROOM} 页。按 TEN_MILLION.md 做物理拆分后再恢复部署。"
            exit 1
          fi
          if [ "$PCT" -ge 70 ]; then
            echo "::warning::站点体积已达 1 GB 上限的 ${PCT}%，剩余约 ${ROOM} 页，该准备拆分了。"
          fi

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: merge
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
