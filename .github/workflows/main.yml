name: ci
# NextStack 官网（Astro 静态站，7 语言）
# 内容直接读取 docs/ 目录 —— release-tracker 流水线每日推送的新文章
# 会随本次构建自动收录进站点与 sitemap.xml。
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 安装依赖
        working-directory: site
        run: npm ci

      - name: 构建站点
        working-directory: site
        run: npm run build

      # 索引闸门校验：确认产物真的按 index-gate.json 执行了。
      # 不通过就不部署——带病上线（比如闸门配错导致百万页全量放开）
      # 需要几周才会在 Search Console 显现，那时已经晚了。
      - name: SEO 审计（闸门与产物一致性）
        run: python3 scripts/release-tracker/seo_audit.py --strict

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
