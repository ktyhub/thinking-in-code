{% extends "base.html" %}

{% block extrahead %}
<!-- SEO: 关键词与社交分享 -->
<meta name="keywords" content="开源项目版本追踪, GitHub Release 追踪, 版本发布洞察, 中间件源码解析, 云原生技术, Spring Boot, Spring AI, Dubbo, Zookeeper, Kubernetes, Kafka, Netty, ElasticJob, MCP, 新技术应用">
<meta property="og:site_name" content="NextStack">
<meta property="og:image" content="https://www.ktyhub.com/img/stags-tracker-icon.png">
<meta property="og:locale" content="zh_CN">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://www.ktyhub.com/img/stags-tracker-icon.png">

<!-- SEO: 结构化数据（静态注入，替代原来 JS 动态注入的 structured-data.js） -->
<script type="application/ld+json">
{
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://www.ktyhub.com/#website",
      "name": "NextStack",
      "alternateName": "开源技术版本发布洞察",
      "url": "https://www.ktyhub.com/",
      "inLanguage": "zh-CN",
      "description": "追踪 GitHub 开源项目版本发布与新技术应用，专注中间件与云原生技术源码解析：Dubbo、Zookeeper、ElasticJob、Kubernetes、Kafka、Netty、Spring 全家桶、Spring AI 与 MCP。",
      "publisher": { "@id": "https://www.ktyhub.com/#org" }
    },
    {
      "@type": "Organization",
      "@id": "https://www.ktyhub.com/#org",
      "name": "NextStack",
      "url": "https://www.ktyhub.com/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.ktyhub.com/img/stags-tracker-icon.png"
      },
      "sameAs": ["https://github.com/ktyhub"]
    }
  ],
  "@context": "https://schema.org"
}
</script>
{% endblock %}
