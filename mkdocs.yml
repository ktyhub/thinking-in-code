site_name: NextStack
site_url: https://www.ktyhub.com
site_author: ktyhub
site_description: 专注开源技术版本发布洞察 - 追踪开源项目版本演进，深度解析技术变革，为技术决策提供前瞻性洞察和升级建议
site_dir: site
edit_uri: ''
copyright: 专注开源技术版本发布洞察，可微信搜索《中间件源码》联系订阅。<br/>Copyright &copy; 2022 - 2025 NextStack
  开源版本洞察平台<br/> 致力于为技术决策者提供最新的开源项目版本演进分析 | 遵循<a href="https://creativecommons.org/licenses/by/4.0/"
  target="_blank">CC BY 4.0</a>许可协议。
theme:
  name: material
  language: zh
  custom_dir: overrides
  favicon: img/favicon.ico
  icon:
    logo: material/code-braces
    repo: fontawesome/brands/github
  static_templates:
  - 404.html
  include_search_page: false
  search_index_only: false
  features:
  - announce.dismiss
  - content.action.edit
  - content.action.view
  - content.code.annotate
  - content.code.copy
  - content.tooltips
  - header.autohide
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - navigation.sections
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow
  - toc.integrate
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: blue
    toggle:
      icon: material/brightness-7
      name: 切换到夜间模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue
    accent: light blue
    toggle:
      icon: material/brightness-4
      name: 切换到日间模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
extra:
  analytics:
    provider: google
    property: G-8ZRYQZ565W
  consent:
    title: Cookie 同意
    description: 我们使用cookies来识别您的重复访问偏好设置，衡量我们文档的有效性， 以及跟踪我们网站的流量。
    actions:
    - accept
    - reject
  alternate:
  - name: 中文
    link: /zh/
    lang: zh
  - name: English
    link: /en/
    lang: en
  - name: Español
    link: /es/
    lang: es
  - name: Français
    link: /fr/
    lang: fr
  - name: Deutsch
    link: /de/
    lang: de
  - name: 日本語
    link: /ja/
    lang: ja
  - name: 한국어
    link: /ko/
    lang: ko
  - name: Português
    link: /pt/
    lang: pt
  - name: Русский
    link: /ru/
    lang: ru
  - name: العربية
    link: /ar/
    lang: ar
extra_css:
- stylesheets/homepage-unified.css
- stylesheets/homepage-fullwidth.css
- stylesheets/navbar-optimization.css
- stylesheets/category-navigation.css
- stylesheets/release-tracker.css
- mermaid.css
extra_javascript:
- javascripts/homepage-fullwidth-helper.js
- javascripts/fullwidth-debug.js
- javascripts/auto-language-redirect.js
- javascripts/api-proxy.js
- javascripts/extra.js
- javascripts/homepage-navbar.js
- javascripts/seo-performance.js
- javascripts/language-switcher.js
- javascripts/category-navigation.js
- mermaid.min.js
- javascripts/baidu-tongji.js
- javascripts/google-tongji.js
plugins:
- search:
    separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
    lang:
    - en
    - zh
- awesome-pages:
    collapse_single_pages: true
    strict: false
- minify:
    minify_html: true
    minify_js: true
    minify_css: true
    htmlmin_opts:
      remove_comments: true
- git-revision-date-localized:
    enable_creation_date: true
    type: datetime
- blog:
    blog_dir: blog
    post_date_format: medium
    post_url_date_format: yyyy/MM/dd
    post_url_format: '{date}/{slug}'
- rss:
    match_path: blog/posts/.*
    date_from_meta:
      as_creation: date
    categories:
    - categories
    - tags
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- meta
- tables
- toc:
    permalink: true
    title: 目录
- pymdownx.arithmatex:
    generic: true
- pymdownx.betterem:
    smart_enable: all
- pymdownx.caret
- pymdownx.critic
- pymdownx.details
- pymdownx.emoji: null
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.keys
- pymdownx.magiclink:
    repo_url_shorthand: true
    user: ktyhub
    repo: thinking-in-code
- pymdownx.mark
- pymdownx.smartsymbols
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tilde
